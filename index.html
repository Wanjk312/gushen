<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票监测工作台 - 股神</title>
  <link rel="stylesheet" href="css/style.css?v=20260804m">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div id="protocol-warn" style="display:none;position:fixed;top:0;left:0;right:0;background:#d32f2f;color:#fff;padding:14px 20px;z-index:9999;font-size:14px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.3);">
    ⚠️ <b>访问方式错误</b>：你正在用 <code style="background:rgba(0,0,0,.3);padding:1px 6px;border-radius:3px;">file://</code> 协议打开页面，浏览器禁止跨源请求，API 全部失败。
    <br>请改用 <b><a href="http://127.0.0.1:8080/" style="color:#ffeb3b;text-decoration:underline;">http://127.0.0.1:8080/</a></b> 访问（先确保后端服务在 8080 端口运行）。
    <button onclick="document.getElementById('protocol-warn').style.display='none'" style="float:right;background:rgba(0,0,0,.3);color:#fff;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;">知道了</button>
  </div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('protocol-warn').style.display = 'block';
    }
  </script>
  <div class="app">
    <!-- 左侧：自选股 -->
    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="stock-search" placeholder="搜索股票代码/名称..." autocomplete="off">
        <div id="search-results" class="search-results"></div>
      </div>
      <div class="watchlist-header">
        <span>自选股</span>
        <span id="watchlist-count" class="count">0</span>
      </div>
      <div id="watchlist" class="watchlist"></div>
    </aside>

    <!-- 中间：图表区 -->
    <main class="main-content">
      <div id="stock-header" class="stock-header"></div>
      <div class="period-bar">
        <button class="period-btn" data-period="minute">分时</button>
        <button class="period-btn" data-period="5day">五日</button>
        <button class="period-btn active" data-period="day">日K</button>
        <button class="period-btn" data-period="week">周K</button>
        <button class="period-btn" data-period="month">月K</button>
        <span id="live-indicator" class="live-indicator">
          <span class="live-dot"></span>
          <span class="live-text">等待中</span>
        </span>
      </div>
      <div class="chart-wrap">
        <div id="main-chart" class="main-chart"></div>
        <div id="loading-overlay" class="loading-overlay">
          <div class="loading-spinner"></div>
          <div class="loading-text">加载中...</div>
        </div>
      </div>
    </main>

    <!-- 右侧：信号面板 -->
    <aside class="signal-panel">
      <div class="signal-header">
        <span>买卖信号</span>
        <span class="signal-hint">实时分析</span>
      </div>
      <div id="signal-list" class="signal-list"></div>
    </aside>
  </div>

  <script src="js/data-engine.js?v=20260804m"></script>
  <script src="js/indicators.js?v=20260804m"></script>
  <script src="js/signals.js?v=20260804m"></script>
  <script src="js/charts.js?v=20260804m"></script>
  <script src="js/app.js?v=20260804m"></script>
</body>
</html>
